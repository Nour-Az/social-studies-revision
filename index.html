<style>

<h1>مفاهيم الدراسات الاجتماعية – الصف السابع</h1>

<script>
const D={
"الوحدة الأولى":[
["الدرس 1: الجغرافيا الطبيعية للمحميات",[
["المحمية الطبيعية","منطقة جغرافية تُخصص لحماية الموارد الطبيعية والكائنات الحية والتنوع البيولوجي، والحفاظ عليها من التدهور أو الاستغلال غير المنظم."],
["التراث الطبيعي","المعالم والمواقع والموارد الطبيعية ذات القيمة البيئية أو الجيولوجية أو العلمية (مثل الجبال، الغابات، الأنهار، الصحاري، والمحميات الطبيعية) والتي لم تدخل الإنسان في صنعها."],
["التنوع البيولوجي","تنوع الكائنات الحية من نباتات وحيوانات وكائنات دقيقة، وتنوع النظم البيئية التي تعيش فيها."]]],
["الدرس 2: البُعد الاقتصادي والبيئي للمحميات والتنمية المستدامة",[
["الكراشيف (الكارشيف)","مادة بناء تقليدية في واحة سيوة تتكون من الملح والطين والرمال، تُستخدم في تشييد البيوت والمنتجات لأنها صديقة للبيئة وتساعد على العزل الحراري الطبيعي."],
["السياحة البيئية","نوع من السياحة يعتمد على زيارة المناطق والمحميات الطبيعية للاستمتاع والتعرف على مكوناتها، مع الحفاظ على البيئة وتقليل الآثار السلبية."],
["التنمية المستدامة","تلبية احتياجات الجيل الحاضر من الموارد مع الحفاظ على البيئة، لضمان قدرة الأجيال القادمة على تلبية احتياجاتها."]]],
["الدرس 3: التغيرات المناخية وأثرها على التنوع البيولوجي",[
["التنوع البيولوجي الأرضي","تنوع الكائنات الحية التي تعيش في البيئات البرية كالصحاري، الجبال، الأودية، والغابات (نباتات وحيوانات)."],
["التنوع البيولوجي البحري","تنوع الكائنات الحية التي تعيش في البحار والمحيطات كالشعاب المرجانية، الطحالب، الأسماك، والكائنات البحرية."],
["الانقراض","الاختفاء والتلاشي التام لنوع من الكائنات الحية من على سطح الأرض نتيجة عوامل طبيعية أو بشرية، بحيث لا يبقى منه أي فرد على قيد الحياة."],
["ابيضاض الشعاب المرجانية","ظاهرة خطيرة تحدث عند ارتفاع درجات حرارة مياه البحار والمحيطات، حيث تفقد المرجانات ألوانها وتتحول إلى اللون الأبيض، مما يهدد الكائنات البحرية المعتمدة عليها ويؤدي لخراب الموئل البحري."]]],
["الدرس 4: توظيف جغرافية الإنترنت في الرصد البيئي",[
["الرصد البيئي","متابعة ومراقبة التغيرات التي تطرأ على البيئة والمحميات الطبيعية (كالغطاء النباتي والشعاب المرجانية والمساحات المائية) وتوثيقها عبر الزمن."],
["الرصد الرقمي","استخدام التقنيات والبرمجيات الرقمية لجمع البيانات الجغرافية وتحليلها عن بعد لخدمة أهداف الحماية."],
["وسائل الاتصال المكاني","تقنيات تُستخدم لتبادل وتداول المعلومات والبيانات الجغرافية والمكانية عبر الوسائل الرقمية."],
["صور الأقمار الصناعية","صور لسطح الأرض يتم التقاطها من الفضاء بواسطة الأقمار الصناعية وتُستخدم في الرصد والمتابعة والدراسة البيئية والمكانية."]]],
["الدرس 5: مصر في العصر الروماني",[
["سلة غذاء روما","وصف وتسمية أُطلقت على مصر في العصر الروماني نظرًا لغزارة إنتاجها الزراعي وتصدير القمح المنتظم لإطعام شعب روما وجيوش الإمبراطورية."],
["الأدلة والشواهد التاريخية","الآثار المادية (كالمباني والأعمدة) والوثائق البردية التي توظّف للتحقيق التاريخي واستنتاج تفاصيل الحياة الاجتماعية والاقتصادية."],
["المصدر الأولي","الوثائق والآثار التي كُتبت أو أنشئت في نفس الفترة التاريخية المراد دراستها (مثل البرديات الرومانية)."]]],
["الدرس 6: مصر في الحقبة القبطية",[
["التقويم القبطي (تقويم الشهداء)","تقويم مصري عريق ارتبط بالمواسم الزراعية في مصر وبذكرى الشهداء في التاريخ القبطي، وما زال يُستخدم لضبط مواعيد الزراعة حتى اليوم."],
["اللغة القبطية","لغة مصرية قديمة كُتبت بحروف يونانية (مع إضافة حروف ديموطيقية)، وتُعد المرحلة الأخيرة من تطور اللغة المصرية القديمة."],
["العمارة والفنون القبطية","نمط معماري وفني فريد يمزج بين الفن المصري القديم والروحانية المسيحية، وظهر بوضوح في تصميم الأديرة والكنائس والأيقونات."]]],
["الدرس 7: مصر في العصر الإسلامي",[
["الفتح الإسلامي لمصر (641م)","وصول جيوش المسلمين بقيادة عمرو بن العاص إلى مصر لتخليص البلاد من الحكم البيزنطي وتأسيس مرحلة تاريخية وحضارية جديدة."],
["مدينة الفسطاط","أول مدينة إسلامية بُنيت في مصر وأفريقيا (أسسها عمرو بن العاص)، وأصبحت العاصمة والمركز العمراني والتجاري الرئيسي."],
["جامع عمرو بن العاص","أول مسجد أقيم في مصر وأفريقيا بالفسطاط، ويعد رمزاً لبداية العمارة الإسلامية ونشر العلوم والتواصل في البلاد."],
["التعايش والاندماج","التسامح الديني والتكامل الاجتماعي والثقافي بين المسلمين والأقباط داخل المجتمع المصري تحت مظلة واحدة."]]],
["الدرس 8: التحقيق التاريخي للتراث المصري",[
["الاستمرارية الحضارية","استمرار بعض العادات والقيم والملامح الحضارية المصرية عبر العصور وانتقالها من جيل إلى جيل."],
["استيعاب الثقافات الوافدة","تفاعل المصريين مع الثقافات القادمة والاستفادة منها مع الحفاظ على هويتهم."],
["الخط الزمني التحليلي","أداة تُستخدم لترتيب الأحداث والعصور ومقارنتها لفهم التغير والاستمرار عبر الزمن."]]],
["الدرس 9: الإطار القانوني والمؤسسي لحماية التراث",[
["الدستور المصري","الوثيقة الرسمية العليا في الدولة التي تستمد منها جميع القوانين والمؤسسات سلطاتها، وتنص مواده على التزام الدولة الصارم بحماية الآثار والتراث والمحميات الطبيعية."],
["سيادة القانون","تطبيق القوانين والتشريعات بحزم وعدالة على جميع الأفراد والمؤسسات، لمنع استغلال المال أو النفوذ للإضرار بالمعالم التاريخية أو البيئية."],
["مؤسسات المجتمع المدني","الجمعيات الأهلية والبيئية والمبادرات التطوعية التي تساهم في نشر الوعي المجتمعي وتدعم جهود الدولة في حماية التراث."],
["منظمة اليونسكو","منظمة دولية تابعة للأمم المتحدة تهتم بحماية التراث الثقافي والطبيعي العالمي وعقد الاتفاقيات الدولية للحفاظ عليه."]]],
["الدرس 10: رائد الأعمال الأخضر",[
["رائد الأعمال الأخضر","شخص يبتكر مشروعات استثمارية وتنموية تعتمد على للموارد المستدامة والطاقة النظيفة، وتهدف إلى دعم الاقتصاد وحماية البيئة والمجتمع في الوقت نفسه."],
["الفكرة الصامتة","فكرة استثمارية جيدة أو عبقرية لكنها غير معروفة للجمهور لغياب التسويق والتواصل الفعال، مما يتطلب تخطيطاً إعلامياً وتطويرياً لإيصالها للمستثمرين والزوار."],
["أبعاد الاستدامة الثلاثة","الركائز الأساسية لنجاح أي مشروع أخضر وتتمثل في: (الحماية البيئية)، (التنمية المجتمعية)، والاستدامة الاقتصادية)."]]],
["الدرس 11: الخبر الإعلامي",[
["الإعلام التنموي","إعلام يتجاوز الدعاية التجارية التقليدية ليصنع وعياً مجتمعياً، ويوجه سلوك الأفراد ويدعمهم نحو المسؤولية الوطنية والحفاظ على التراث والموارد المستدامة."],
["التكامل بين الاستثمار والإعلام","ربط كل خطوة تنموية في المشروع الاستثماري بحملة تغطية إعلامية مرافقة لتوعية الأفراد وجذب المستثمرين."],
["أدوات التصميم الرقمي (Canva)","استخدام برمجيات تكنولوجيا المعلومات والاتصالات لإنتاج محتوى رقمي إبداعي وبوسترات وشعارات مرئية مؤثرة."]]]
],
"الوحدة الثانية":[
["الدرس 1: العمل الميداني واكتشاف بيئات مصر الطبيعية",[
["العمل الميداني","دراسة الظواهر في مواقعها الفعلية من خلال الملاحظة، وجمع البيانات، وإجراء المقابلات، وتوثيق الأدلة للوصول إلى معلومات دقيقة بعيدة عن الشائعات والتخمين."],
["الإعلام التنموي","إعلام يساهم في توعية المجتمع بقضايا التنمية، وتقل الحقائق، وتشجيع الأفراد على المشاركة في تحسين بيئتهم ودعم التنمية المستدامة."]]],
["الدرس 2: الجغرافيا الإعلامية ووسائل الاتصال",[
["الجغرافيا الإعلامية","توظيف المعلومات والأدوات الجغرافية في إعداد التقارير والمواد الإعلامية لعرض الظواهر والموارد والقضايا المكانية بدقة ووضوح."],
["أهمية الجغرافيا الإعلامية","اكتشاف الثروات الطبيعية. رصد التغيرات العمرانية والسكانية. توفير بيانات دقيقة تخدم التنمية وجودة الحياة."]]],
["الدرس 3: استصلاح الطبيعة والتغطية الميدانية",[
["التغطية الميدانية","انتقال الصحفي أو الفريق الإعلامي إلى موقع المشروع التنموي لجمع المعلومات وتوثيق الوقائع والتحديات بصورة مباشرة."],
["استصلاح الطبيعة","تهيئة البيئات الطبيعية القاسية وتحويل الأراضي غير المستغلة إلى مناطق صالحة للإنتاج والزراعة باستخدام التكنولوجيا والجهود البشرية."]]],
["الدرس 4: الإعلام الرقمي وجغرافية الإنترنت",[
["الإعلام الرقمي والتراث الطبيعي","الترويج للثروات البيئية والمحميات الطبيعية باستخدام التكنولوجيا، مما يساهم في جذب السياحة البيئية ودعم الاقتصاد الوطني."],
["جغرافية الإنترنت","توظيف الوسائل الرقمية والخرائط الجغرافية عبر الإنترنت لعرض المواقع والظواهر الطبيعية، وإتاحة المعلومات للجمهور عالمياً وتجاوز الحدود الجغرافية."]]],
["الدرس 5: تحقيقات من زمن الرومان",[
["القمح المصري (سلة غذاء روما)","المحصول الاستراتيجي الذي اعتمدت عليه الإمبراطورية الرومانية لإمداد عاصمتها وسكانها بالغذاء."],
["التحقيق التاريخي القصصي","عرض المعلومات والأدلة التاريخية في سياق قصصي مترابط وجذاب يُقرب الأحداث للمشاهد والقارئ دون إغفال الدقة والمصداقية."],
["مصر ولاية رومانية","أصبحت مصر ولاية تابعة للإمبراطورية الرومانية عام 30 ق.م. في عهد الإمبراطور أوكتافيوس (أغسطس)، واكتسبت أهمية اقتصادية كبرى بفضل إنتاج القمح."]]],
["الدرس 6: كواليس مصر القبطية",[
["الإعلام الوثائقي والتحقيق القصصي","أسلوب إعلامي يجمع الأدلة من المخطوطات والآثار ويتحقق منها، ليقدمها للجمهور في قالب موثوق وجذاب يعزز الوعي بالتراث والتماسك المجتمعي."],
["التراث القبطي","جزء أصيل من التراث الحضاري المصري، يضم شواهد مادية وفنية وتاريخية، بالإضافة إلى عادات وتقاليد اجتماعية تعكس تنوع الثقافة المصرية واستمراريتها."]]],
["الدرس 7: السرد القصصي والتراث الإسلامي",[
["التفاعل الثقافي والتعايش","دراسة التنوع الديني والمجتمعي (المساجد والكنائس والمعابد اليهودية) بموضوعية. فهم صور التعايش والتعاون بين أبناء المجتمع المصري عبر العصور. تجنب التعميم وإبراز الاحترام المتبادل وقيم المواطنة."],
["القاهرة التاريخية","مركز حضاري وعلمي وتجاري وفني. تضم معالم تكشف عن ترابط المهارات الهندسية والمؤسسات التعليمية والنشاط الاقتصادي. تعبر عن استمرارية الحضارة الإسلامية وتنوعها عبر العصور."],
["ملامح الحضارة الإسلامية","العمارة: المساجد والمدارس والمأذن. العلوم: الطب والفلك والرياضيات والهندسة. التجارة: الأسواق والوكالات والحرف والمنسوجات والصناعات التقليدية."]]],
["الدرس 8: آلة نقد المصادر والأدلة التاريخية",[
["نقد المصادر ورصد التحيز","فحص خلفية الكاتب وموقعه ومصلحته وظروف العصر للتأكد من مدى موضوعية الرواية التاريخية وعدم الانحياز."],
["الدليل التاريخي","حقيقة أو معلومة يستخرجها المؤرخ من المصدر بعد فحصه ونقده على البرهنة على حدوث واقعة معينة."],
["المصدر التاريخي","كل ما تتركه العصور الماضية من وثائق، برديات، آثار، ومؤلفات."]]],
["الدرس 9: الإعلام التنموي وصناعة الثقة",[
["الثقة المجتمعية والشائعات","بناء علاقة إيجابية قائمة على الشفافية بين المواطن ومؤسسات الدولة من خلال دحض الشائعات بالأرقام والأدلة الميدانية الموثقة."],
["الإعلام التنموي","إعلام متخصص يخدم القضايا القومية والتنموية، ويركز على تفسير أهداف المشروعات القومية ونتائجها وربطها بجودة حياة المواطنين بدلاً من مجرد نقل الأخبار اليومية السريعة."]]],
["الدرس 10: شفرة الدستور والمواطنة الإيجابية",[
["الديمقراطية والتعبير السلمي","ممارسة حق الانتخاب والترشح. التعبير عن الرأي بالوسائل السلمية والقانونية. المردود المجتمعي: دعم المشاركة الفعالة وصنع القرار."],
["الواجبات والمسؤوليات الوطنية","الدفاع عن الوطن. حماية الممتلكات العامة. الالتزام بالقوانين. المردود المجتمعي: حفظ أمن واستقرار المجتمع وصيانة مؤسساته."],
["الحقوق الأساسية","كفالة الرعاية الصحية والتعليم. المساواة أمام القانون. المردود المجتمعي: تحقيق العدالة الاجتماعية ودعم رفاهية المواطنين."]]],
["الدرس 11: صوت المجتمع المحلي",[
["المساحات الخضراء والبيئة المدرسية","التأكيد على أهمية المسطحات الخضراء. تحسين البيئة المدرسية والفراغات الآمنة. مشاركة الطلاب في مبادرات التشجير والحفاظ على البيئة."],
